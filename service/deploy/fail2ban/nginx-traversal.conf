# fail2ban filter: path traversal and secret-hunting probes against nginx.
# Matches .git/, ../, .env, wp-admin, phpmyadmin and similar in the request line,
# whatever the response status: the site's SPA fallback answers 200 to unknown
# paths, and none of these paths is ever legitimate here.
[Definition]
failregex = ^<HOST> -.*"[A-Z]+ [^"]*(\.\./|\.git/|\.env\b|wp-admin|wp-login|phpmyadmin|xmlrpc\.php|\.aws/|\.ssh/|/etc/passwd)[^"]*" \d{3} .*$
ignoreregex =
