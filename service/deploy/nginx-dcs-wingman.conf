# DCS Wingman: nginx in front of the presence service, loopback only.
# All traffic arrives through cloudflared on this host, so nothing listens publicly.
# Real client IPs come from Cloudflare's CF-Connecting-IP header.

limit_req_zone $http_cf_connecting_ip zone=wingman_api:10m rate=600r/m;
limit_req_zone $http_cf_connecting_ip zone=wingman_site:10m rate=300r/m;
limit_req_status 429;

server {
    listen 127.0.0.1:80 default_server;
    server_name _;

    root /opt/dcs-wingman/site-dist;
    index index.html;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 256k;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8600;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /v1/ {
        limit_req zone=wingman_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        limit_req zone=wingman_site burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
